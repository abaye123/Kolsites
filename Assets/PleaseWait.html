<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>טוען...</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Rubik, sans-serif;
            background: linear-gradient(135deg, #f8f9fc 0%, #e8eef7 100%);
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 24px;
        }
        .spinner {
            width: 64px;
            height: 64px;
            border: 5px solid rgba(0, 120, 212, 0.15);
            border-top-color: #0078D4;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { color: #1f2937; font-weight: 600; margin: 0; }
        p { color: #4b5563; margin: 0; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>טוען את הדף</h1>
        <p>אנא המתן...</p>
    </div>
</body>
</html>
